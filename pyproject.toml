[project]
name = "comfyui-jmhl-image-api"
version = "0.1.0"
description = "JMHL Image API: OpenAI-compatible image-to-image / text-to-image ComfyUI node with custom base_url and exact output size"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "Pillow>=10.0",
    "numpy>=1.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
